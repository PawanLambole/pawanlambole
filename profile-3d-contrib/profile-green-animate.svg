<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="100%" height="100%">
  <rect width="100%" height="100%" rx="12" fill="#ffffff" stroke="#e1e4e8" stroke-width="1" />
  <text x="50%" y="45%" dominant-baseline="middle" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#0366d6">
    3D Contribution Graph (Generating...)
  </text>
  <text x="50%" y="60%" dominant-baseline="middle" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#586069">
    Please wait while GitHub Actions generates the animated calendar.
  </text>
  <circle cx="50%" cy="80%" r="6" fill="#0366d6">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>
